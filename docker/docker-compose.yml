# docker-compose for local dev + Docker-tier deployment.
# Ships Postgres+pgvector, Redis, and (optionally) the app/bot stack.
# Owner in Docker-tier only needs to fill .env with their bot token and
# BASE / SOL keys — no other secrets go to us.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: openrelay_tg
      POSTGRES_USER: openrelay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openrelay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrelay -d openrelay_tg"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
