[project]
name = "openrelay-tg-bot"
version = "0.0.1"
description = "TG channel AI bot — summarize, FAQ, ask — pay-per-use in USDC via OpenRelay/x402"
requires-python = ">=3.12"

dependencies = [
    # TG
    "aiogram>=3.13,<4",
    "telethon>=1.36,<2",
    # DB
    "sqlalchemy[asyncio]>=2.0.34,<3",
    "asyncpg>=0.29",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    # HTTP / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # Redis (rate limits + job queue)
    "redis>=5.1",
    # Web3
    "eth-account>=0.13",
    "web3>=7.4",
    "solana>=0.34",
    "solders>=0.21",
    # Embeddings
    "sentence-transformers>=3.1",
    # Config / logging
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    # Doc ingest (later — MVP without heavy deps)
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line-length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
